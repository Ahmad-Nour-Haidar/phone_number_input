name: smart_phone_input
description: >-
  A phone number form field with a country picker, as-you-type formatting and
  libphonenumber validation, with Arabic digits, Arabic search and 22 languages.
version: 1.0.0
repository: https://github.com/Ahmad-Nour-Haidar/smart_phone_input
issue_tracker: https://github.com/Ahmad-Nour-Haidar/smart_phone_input/issues
topics:
  - phone-number
  - phone
  - form
  - validation
  - arabic
screenshots:
  - description: A Saudi number formatted as it is typed, with its E.164 form, international format and type.
    path: screenshots/formatted_number.png
  - description: The searchable country list in a bottom sheet, with favorite countries first.
    path: screenshots/country_list.png
  - description: The country list in Arabic, in a dialog, laid out right to left.
    path: screenshots/arabic_country_list.png

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  dlibphonenumber: ^1.1.74

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/flags/
